# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# Everything here either tightens a default or removes a development convenience.
# Anything genuinely secret has no default at all — the app refuses to start
# without it rather than running on a value that is public in this repository.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  jpa:
    # Flyway owns the schema. This only ever verifies that it matches the mappings.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    # A production database is migrated deliberately, never baselined by accident.
    baseline-on-migrate: false

server:
  error:
    # Never leak exception messages or stack traces to a browser.
    include-message: never
    include-stacktrace: never
    include-exception: false
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    # The UI is served from the same origin in production, so nothing is allowed
    # cross-origin unless a deployment explicitly opts in.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: ${APP_JWT_ISSUER:apparel-tracking}
    access-token-ttl: ${APP_JWT_TTL:PT12H}
  bootstrap:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD}
  seed:
    demo-data: false

logging:
  level:
    root: INFO
    com.apparel.tracking: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
