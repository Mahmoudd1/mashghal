<div class="login-layout">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header class="login-header">
      <mat-card-title>{{ 'app.title' | translate }}</mat-card-title>
      <app-language-toggle />
    </mat-card-header>

    @if (submitting()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'auth.username' | translate }}</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'auth.password' | translate }}</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>

        @if (errorKey(); as key) {
          <p class="login-error">{{ key | translate }}</p>
        }

        <button mat-flat-button type="submit" [disabled]="form.invalid || submitting()">
          {{ 'auth.signIn' | translate }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
