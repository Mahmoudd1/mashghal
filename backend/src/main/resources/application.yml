spring:
  application:
    name: apparel-tracking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apparel}
    username: ${DB_USERNAME:apparel}
    password: ${DB_PASSWORD:apparel}
    hikari:
      pool-name: apparel-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that it matches the mappings.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  data:
    web:
      pageable:
        # Serialise Page responses through a stable DTO rather than PageImpl's
        # internal shape, so the JSON contract does not shift under us.
        serialization-mode: VIA_DTO
        default-page-size: 25
        max-page-size: 200

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  # Turn the docs off outside development with API_DOCS_ENABLED=false.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

app:
  cors:
    # The dev server proxies /api but forwards the browser's Origin header, so the
    # port the UI is served from must be listed here. Comma-separated when set via
    # the environment. In production the UI is same-origin and this is unused.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  jwt:
    # Override in every non-local environment (APP_JWT_SECRET).
    secret: ${APP_JWT_SECRET:local-development-only-secret-change-me-0123456789abcdef}
    issuer: apparel-tracking
    access-token-ttl: PT12H
  bootstrap:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}
  seed:
    # Demo dataset for a fresh database. Never enable this outside development.
    demo-data: ${APP_SEED_DEMO_DATA:false}

logging:
  level:
    com.apparel.tracking: DEBUG
