<mat-toolbar color="primary" class="shell-toolbar">
  <button mat-icon-button (click)="toggleSidenav()" [attr.aria-label]="'nav.dashboard' | translate">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="shell-title">{{ 'app.title' | translate }}</span>
  <span class="shell-spacer"></span>

  <app-language-toggle />

  @if (auth.user(); as user) {
    <button mat-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      <span>{{ user.displayName }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="shell-user-role">{{ 'role.' + user.role | translate }}</div>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ 'auth.logout' | translate }}</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" [opened]="sidenavOpen()" class="shell-sidenav">
    <mat-nav-list>
      @for (item of visibleNavItems(); track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-nav-item">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.labelKey | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
